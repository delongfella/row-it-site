[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- Old WordPress URLs -> new URLs (keeps Google rankings and shared links working) ---
[[redirects]]
  from = "/about-me"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/contact-us"
  to = "/contact/"
  status = 301
  force = true

[[redirects]]
  from = "/gallery-page-3"
  to = "/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/feed"
  to = "/rss.xml"
  status = 301
  force = true

[[redirects]]
  from = "/author/*"
  to = "/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/2025/07/02/how-perception-shapes-our-reality"
